networks:
  private_net:
    external: true

name: dev_db
services:
  primary:
    image: postgres:16
    container_name: primary
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_REPLICATION_USER: postgres
      POSTGRES_REPLICATION_PASSWORD: 1234
    volumes:
      - ./primary/data:/var/lib/postgresql/data
      - ./primary/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - private_net

  replica:
    image: postgres:16
    container_name: replica
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_REPLICATION_USER: postgres
      POSTGRES_REPLICATION_PASSWORD: 1234
      PRIMARY_HOST: primary
      # Optional: set a slot name; omit to run without slots
      REPLICATION_SLOT_NAME: standby1
    volumes:
      - ./replica/data:/var/lib/postgresql/data
      - ./replica/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    depends_on:
      primary:
        condition: service_healthy
    networks:
      - private_net

  #  postgres:
  #    image: postgres:latest
  #    container_name: postgres
  #    environment:
  #      POSTGRES_USER: admin
  #      POSTGRES_PASSWORD: 1234
  #    volumes:
  #      - postgres_data:/var/lib/postgresql/data
  #    ports:
  #      - "5432:5432"
  #    networks:
  #      - private_net

  pgadmin:
    image: dpage/pgadmin4:9.11
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 1234
      PGADMIN_LISTEN_ADDRESS: "0.0.0.0"
      PGADMIN_LISTEN_PORT: "5050"
    volumes:
      - ./pgadmin/data:/var/lib/pgadmin
    ports:
      - "5050:5050"
    networks:
      - private_net